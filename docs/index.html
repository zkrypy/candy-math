<style>

/* Layout: one column app, sticky candy bar on top, jars grid on home, a single question card while playing. */
:root {
  --bg: #fff3f8;
  --bg2: #ffe6f1;
  --card: #ffffff;
  --ink: #45244f;
  --muted: #8a6b93;
  --line: #f2d3e3;
  --paper: #ffffff;
  --shade: #6b4a78;
  --accent: #ff5c9a;
  --accent-ink: #ffffff;
  --good: #1f9e6b;
  --good-bg: #dcf7ea;
  --bad: #e0445f;
  --bad-bg: #ffe1e6;
  --lemon: #ffcd3c;
  --mint: #3ccfa6;
  --berry: #ff6b9a;
  --grape: #a47bff;
  --peach: #ff9a62;
  --sky: #5bbcff;
  --glass: rgba(255, 255, 255, 0.55);
  --font-display: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #6cc6ff; --bg: #241629; --bg2: #2f1d36; --card: #33213b; --ink: #fbeaf4; --muted: #c9aed3; --line: #4a3354;
    --paper: #3d2a46; --shade: #e7c8f2; --accent: #ff77ad; --accent-ink: #2a1230;
    --good: #5fe0a8; --good-bg: #1d3b30; --bad: #ff7d93; --bad-bg: #4a2230; --glass: rgba(255, 255, 255, 0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #6cc6ff; --bg: #241629; --bg2: #2f1d36; --card: #33213b; --ink: #fbeaf4; --muted: #c9aed3; --line: #4a3354;
  --paper: #3d2a46; --shade: #e7c8f2; --accent: #ff77ad; --accent-ink: #2a1230;
  --good: #5fe0a8; --good-bg: #1d3b30; --bad: #ff7d93; --bad-bg: #4a2230; --glass: rgba(255, 255, 255, 0.08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 12% 8%, var(--bg2) 0 120px, transparent 121px), radial-gradient(circle at 92% 30%, var(--bg2) 0 90px, transparent 91px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.bar-in { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 24px; font-weight: 600; background: none; border: 0; padding: 0; }
.brand svg { width: 34px; height: 34px; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill.bump { animation: bump 0.5s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }
.sync { font-size: 13px; color: var(--muted); }

/* home */
.hello { padding: 18px 0 8px; display: flex; flex-wrap: wrap; align-items: end; gap: 8px 20px; }
.hello h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; }
.hello p { margin: 0; color: var(--muted); font-weight: 700; }
.jars { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; margin-top: 18px; }
.jar { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 14px 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.jar svg.jarsvg { width: 120px; height: 140px; }
.jar h3 { font-size: 18px; line-height: 1.2; min-height: 2.4em; display: flex; align-items: center; }
.jar .meta { font-size: 13px; color: var(--muted); font-weight: 700; }
.jar .acts { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12); transition: transform 0.1s; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.soft { background: var(--bg2); color: var(--ink); box-shadow: none; }
.btn.big { font-size: 20px; padding: 14px 28px; font-family: var(--font-display); font-weight: 600; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.big-acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 22px; }
.action { display: flex; gap: 16px; align-items: center; text-align: left; padding: 18px 20px; border-radius: 24px; border: 2px solid var(--line); background: var(--card); }
.action svg { width: 56px; height: 56px; flex: none; }
.action h3 { font-size: 20px; }
.action p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.foot { margin-top: 26px; display: flex; gap: 16px; justify-content: center; }
.link { background: none; border: 0; color: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }

/* quiz */
.qtop { display: flex; align-items: center; gap: 12px; padding: 6px 0 12px; flex-wrap: wrap; }
.qtop h2 { font-size: 20px; }
.track { flex: 1 1 200px; display: flex; gap: 4px; align-items: center; min-width: 0; }
.track i { flex: 1; height: 10px; border-radius: 6px; background: var(--line); }
.track i.ok { background: var(--good); }
.track i.no { background: var(--bad); }
.track i.now { background: var(--accent); }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--muted); }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 28px; padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 18px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--bg2); color: var(--muted); }
.chip.warn { background: var(--bad-bg); color: var(--bad); }
.prompt { font-size: clamp(19px, 2.6vw, 23px); line-height: 1.45; font-weight: 600; max-width: 62ch; }
.figwrap { overflow-x: auto; }
.fig { display: block; }
.fig .ink { fill: var(--ink); }
.fig .stroke { stroke: var(--ink); stroke-width: 2; }
.fig .stroke.thin { stroke-width: 1.2; }
.fig .strokeish { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.fig .paper { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.fig .shade { fill: var(--shade); stroke: var(--ink); stroke-width: 1.5; }
.fig .gridl { stroke: var(--ink); stroke-width: 1; }
.fig .lab { fill: var(--ink); font: 700 15px var(--font-body); }
.fig .lab.sm { font-size: 13px; }
.fig .lab.b { font-weight: 800; }
.fig .box { fill: var(--bg2); stroke: var(--accent); stroke-width: 2; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.82em; line-height: 1.05; margin: 0 0.12em; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 0.15em; }
.mx { white-space: nowrap; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; font-size: 16px; }
.tbl th, .tbl td { border: 2px solid var(--line); padding: 6px 12px; text-align: center; font-variant-numeric: tabular-nums; }
.tbl th { background: var(--bg2); font-weight: 800; }

/* answer widgets */
.parts { display: flex; flex-direction: column; gap: 12px; }
.part { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 20px; font-weight: 700; }
.ans { width: auto; min-width: 4.5ch; font: 800 22px var(--font-body); text-align: center; padding: 8px 10px; border-radius: 14px; border: 3px solid var(--line); background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.ans.on { border-color: var(--accent); background: var(--card); }
.ans.ok { border-color: var(--good); background: var(--good-bg); }
.ans.no { border-color: var(--bad); background: var(--bad-bg); }
.keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 360px; }
.keypad button { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 0; font: 800 20px var(--font-body); }
.keypad button:active { background: var(--bg2); }
.keypad .k-wide { font-size: 14px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.opts.text { grid-template-columns: 1fr; }
.opts.dense { grid-template-columns: repeat(var(--cols, 9), minmax(0, 1fr)); gap: 6px; }
.opt { border: 3px solid var(--line); background: var(--bg); border-radius: 16px; padding: 12px 14px; font-size: 18px; font-weight: 700; text-align: left; display: flex; align-items: center; justify-content: flex-start; gap: 10px; min-height: 52px; }
.opts:not(.text) .opt { justify-content: center; text-align: center; }
.opts.dense .opt { padding: 8px 2px; font-size: 15px; min-height: 40px; border-radius: 10px; }
.opt.sel { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.opt .tick { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: 15px; }
.opt.sel .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt svg { max-height: 110px; }
.rowq { display: flex; flex-direction: column; gap: 12px; }
.rowline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 20px; font-weight: 700; }
.seg { display: inline-flex; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--bg); padding: 6px 12px; font-weight: 800; font-size: 18px; min-width: 44px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.sel { background: var(--accent); color: var(--accent-ink); }
.seg.ok { border-color: var(--good); }
.seg.no { border-color: var(--bad); }
.order-slots, .order-pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 54px; align-items: center; }
.order-slots { padding: 10px; border: 3px dashed var(--line); border-radius: 16px; }
.order-slots.ok { border-color: var(--good); border-style: solid; }
.order-slots.no { border-color: var(--bad); border-style: solid; }
.ochip { border: 3px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.order-slots .ochip { background: var(--card); border-color: var(--accent); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; align-items: start; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.mitem { border: 3px solid var(--line); background: var(--bg); border-radius: 16px; padding: 10px 12px; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
.mitem.sel { border-color: var(--accent); }
.mitem .tag { width: 26px; height: 26px; border-radius: 50%; flex: none; font-size: 13px; display: grid; place-items: center; color: #2b1631; font-weight: 900; }
.mitem.ok { border-color: var(--good); }
.mitem.no { border-color: var(--bad); }
.board { touch-action: manipulation; user-select: none; }
.board .cell { fill: var(--paper); stroke: var(--muted); stroke-width: 1; cursor: pointer; }
.board .cell.given { fill: var(--shade); cursor: default; }
.board .cell.mine { fill: var(--accent); }
.board .cell.exp { fill: var(--good); }
.board .mirror { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 8 6; }
.board .dot { fill: var(--ink); cursor: pointer; }
.board .dot.sel { fill: var(--accent); }
.board .hit { fill: transparent; cursor: pointer; }
.board .tri { fill: color-mix(in srgb, var(--accent) 25%, transparent); stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
.board .ring { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.count { font-weight: 800; color: var(--muted); }

.feedback { border-radius: 18px; padding: 14px 16px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); color: var(--good); }
.feedback.no { background: var(--bad-bg); color: var(--bad); }
.feedback.hint { background: var(--bg2); color: var(--ink); }
.feedback .why { color: var(--ink); font-weight: 600; }
.qacts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* results / report */
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 10px; }
.result .score { font-family: var(--font-display); font-size: 64px; line-height: 1; }
.rlist { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.rrow { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 2px solid var(--line); }
.rrow b { flex: none; width: 1.4em; }
.rrow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.rrow .ok { color: var(--good); }
.rrow .no { color: var(--bad); }
.report { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
.rt { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px 18px; }
.rt h3 { font-size: 19px; margin-bottom: 8px; }
.sk { display: grid; grid-template-columns: minmax(0, 1fr) 120px 64px; gap: 10px; align-items: center; padding: 4px 0; font-size: 15px; }
.meter { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 6px; }
.sk .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }

.burst { position: fixed; pointer-events: none; z-index: 50; width: 12px; height: 12px; border-radius: 50%; }
@media (prefers-reduced-motion: reduce) { .pill.bump { animation: none; } .burst { display: none; } }
@media (max-width: 520px) {
  .match { gap: 8px 10px; }
  .mitem { font-size: 17px; }
  .sk { grid-template-columns: minmax(0, 1fr) 70px 52px; }
  .opts.dense { --cols: 6 !important; }
}

/* glossary words, reading help, word sheet */
.gw { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; border-radius: 4px; }
.gw:hover { background: var(--bg2); }
.feedback.read { background: var(--card); border: 2px dashed var(--accent); color: var(--ink); font-weight: 600; }
.feedback.read b { color: var(--accent); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(40, 15, 45, 0.35); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--card); border: 2px solid var(--line); border-radius: 26px; padding: 20px 22px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; max-height: 80vh; overflow: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 28px; }
.sheet-vi { font-size: 20px; font-weight: 700; margin: 0; }
.sheet-ex { margin: 0; color: var(--muted); font-weight: 600; }
.wordchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.wchip.known { border-color: var(--good); background: var(--good-bg); }
.wchip.weak { border-color: var(--bad); background: var(--bad-bg); }

/* subject tabs + science notes */
.subj-tabs { display: inline-flex; gap: 6px; margin-top: 16px; padding: 5px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
.subj-tab { border: 0; background: transparent; color: var(--ink); font: 800 17px var(--font-body); padding: 8px 20px; border-radius: 999px; cursor: pointer; }
.subj-tab.on { background: var(--accent); color: var(--accent-ink); }
.subj-head { margin: 18px 0 4px; font-size: 24px; }
.ans.txt { text-align: left; font-variant-numeric: normal; }
.rt.note p { margin: 0 0 8px; line-height: 1.55; font-size: 17px; }
.rt.note .note-vi { color: var(--muted); border-left: 4px solid var(--line); padding-left: 10px; margin: 10px 0 0; }
.figwrap ul { margin: 0; padding-left: 22px; font-size: 17px; line-height: 1.6; }
.opt svg.chart { max-height: none; width: 100%; height: auto; }
.opts:has(svg.chart) { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.howto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.hcard { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hcard ol { margin: 0; padding-left: 22px; line-height: 1.5; }
.hcard p { margin: 0; font-size: 15px; line-height: 1.45; }
.hcard .htrap { color: var(--bad); }
.howto .tbl td { text-align: left; font-size: 15px; }

<script>
// ===== Candy Math: pure logic (question bank, generators, grading) =====
// No DOM access here so it can be tested with node.

const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
};
const round6 = (x) => Math.round(x * 1e6) / 1e6;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

// number to display string; groups of 3 with spaces for |x| >= 10000 (like the worksheets)
function nf(x) {
  x = round6(x);
  const neg = x < 0; const s = Math.abs(x).toString();
  let [i, d] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + i + (d ? '.' + d : '');
}
const money = (x) => '$' + round6(x).toFixed(2);

// parse a typed answer
function parse(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/[−–]/g, '-').replace(/[$%,]/g, '').replace(/\s*\/\s*/g, '/');
  if (!s) return null;
  let m = s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);
  if (m) { const d = +m[4]; if (!d) return null; const v = (+m[2] + +m[3] / d) * (m[1] ? -1 : 1); return { v, raw: s, isMixed: true, isFrac: false, num: +m[3], den: d, whole: +m[2] }; }
  m = s.match(/^(-?\d+)\/(\d+)$/);
  if (m) { const d = +m[2]; if (!d) return null; return { v: +m[1] / d, raw: s, isFrac: true, isMixed: false, num: +m[1], den: d }; }
  const t = s.replace(/\s+/g, '');
  m = t.match(/^-?(\d+\.?\d*|\.\d+)$/);
  if (m) { const dp = t.includes('.') ? t.split('.')[1].length : 0; return { v: parseFloat(t), raw: t, isFrac: false, isMixed: false, dp }; }
  return null;
}
const same = (a, b) => Math.abs(a - b) < 1e-9;
const N = (x) => (p) => !!p && same(p.v, x);
const ANY = (...xs) => (p) => !!p && xs.some((x) => same(p.v, x));
const F = (x) => (p) => !!p && same(p.v, x) && (p.isFrac || p.isMixed);
const M = (x) => (p) => !!p && same(p.v, x) && p.isMixed;
const isInt = (p) => !!p && Number.isInteger(p.v) && !p.isFrac && !p.isMixed;
const isPrime = (n) => { if (!Number.isInteger(n) || n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const isSquare = (n) => Number.isInteger(n) && n > 0 && Number.isInteger(Math.sqrt(n));
const triNum = (n) => (n * (n + 1)) / 2;

// value of a "a/b" or "w a/b" string
function fv(s) { const p = parse(s); return p ? p.v : NaN; }

const svg = (w, h, inner, cls = '') => `<svg class="fig ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%;height:auto" role="img">${inner}</svg>`;
function dotTriangle(n, x0, y0, sp = 18, align = 'center') {
  let s = '';
  for (let r = 0; r < n; r++) {
    const cnt = r + 1;
    for (let c = 0; c < cnt; c++) {
      let x;
      if (align === 'center') x = x0 + (c - (cnt - 1) / 2) * sp;
      else if (align === 'left') x = x0 + c * sp;
      else x = x0 - c * sp;
      s += `<circle class="ink" cx="${x}" cy="${y0 + r * sp}" r="5"/>`;
    }
  }
  return s;
}

  const W = opts.w || 460, x0 = 30, x1 = W - 30, y = 70;

    s += `<line class="stroke" x1="${X(t.v)}" y1="${y - 10}" x2="${X(t.v)}" y2="${y + 10}"/>`;
    if (t.top) s += lab(X(t.v), y - 20, t.top);

// inq: parts = [[pre, ans, post, ex?], ...]; ans: number | "a/b" | "w a/b" | fn (needs ex) | null (question-level check)
function inq(o, parts) {
  const ps = parts.map(([pre, ans, post, ex]) => {
    let fn = ans, e = ex;
    if (typeof ans === 'number') { fn = N(ans); e = e ?? nf(ans); }
    else if (typeof ans === 'string') { const p = parse(ans); fn = p.isMixed ? M(p.v) : p.isFrac ? F(p.v) : N(p.v); e = e ?? ans; }
    return { pre: pre || '', post: post || '', fn, ex: e, wide: o.wide };
  });
  return Object.assign({ k: 'in', parts: ps }, o);
}

const key = (r, c) => r + ',' + c;
function gridSet(cells) { return new Set(cells.map(([r, c]) => key(r, c))); }
function symCount(set, rows, cols) {
  const cells = [...set].map((k) => k.split(',').map(Number));
  const has = (r, c) => set.has(key(r, c));
  let n = 0;
  if (cells.every(([r, c]) => has(r, cols - 1 - c))) n++;
  if (cells.every(([r, c]) => has(rows - 1 - r, c))) n++;
  if (rows === cols) {
    if (cells.every(([r, c]) => has(c, r))) n++;
    if (cells.every(([r, c]) => has(cols - 1 - c, rows - 1 - r))) n++;
  }
  return n;
}

const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
function triKind(p) {
  const [a, b, c] = p;
  const area = Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1]));
  if (area < 1e-6) return 'line';
  const s = [d2(a, b), d2(b, c), d2(c, a)];
  const eq = (x, y) => Math.abs(x - y) < 1e-6;
  const pairs = (eq(s[0], s[1]) ? 1 : 0) + (eq(s[1], s[2]) ? 1 : 0) + (eq(s[0], s[2]) ? 1 : 0);
  if (pairs === 3) return 'equilateral';
  if (pairs === 1) return 'isosceles';
  return 'scalene';
}

const triLattice = (n) => { const p = []; for (let r = 0; r < n; r++) for (let c = 0; c < n - (r % 2 ? 1 : 0); c++) p.push([c + (r % 2 ? 0.5 : 0), r * Math.sqrt(3) / 2]); return p; };

// txt: parts = [{pre, post, acc: [accepted answers], ex}]; small spelling slips are accepted
const normTxt = (s) => String(s == null ? '' : s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9°.\- ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(a|an|the) /, '');
function lev(a, b) {
  const d = []; for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// 'exact' | 'near' (spelling slip) | false
function txtMatch(raw, acc) {
  const r = normTxt(raw); if (!r) return false;
  if (acc.some((x) => normTxt(x) === r)) return 'exact';
  return acc.some((x) => { const n = normTxt(x); const tol = n.length >= 8 ? 2 : n.length >= 5 ? 1 : 0; return tol && lev(r, n) <= tol; }) ? 'near' : false;
}
function txtq(o, parts) { return Object.assign({ k: 'txt', parts: parts.map(([pre, acc, post]) => ({ pre: pre || '', post: post || '', acc: [].concat(acc), ex: [].concat(acc)[0] })) }, o); }
// order with a fixed answer (items given in the right order)
const ordx = (o, items, hint) => Object.assign({ k: 'order', items: items.slice(), a: items.slice(), ohint: hint }, o);

// ===================== GRADING =====================
// response shapes: in: [strings]; mc: idx; multi: [idx]; rows: [[choice]]; order: [items]; match: [rightIdx]; grid: Set of "r,c" (added); dots: [idx]
function grade(q, resp) {
  try {
    switch (q.k) {
      case 'in': {
        const ps = resp.map(parse);
        if (ps.some((p) => !p)) return false;
        if (q.check) return !!q.check(ps);
        return q.parts.every((pt, i) => pt.fn(ps[i]));
      }
      case 'txt': return q.parts.every((p, i) => !!txtMatch(resp[i], p.acc));
      case 'mc': return resp === q.a;
      case 'multi': { const s = resp.slice().sort((a, b) => a - b); return s.length === q.a.length && s.every((x, i) => x === q.a[i]); }
      case 'rows': if (q.check) return !!q.check(resp); return q.rows.every((r, i) => r.a.every((x, j) => resp[i] && resp[i][j] === x));
      case 'order': return resp.length === q.a.length && resp.every((x, i) => x === q.a[i]);
      case 'match': return q.a.every((x, i) => resp[i] === x);
      case 'grid': {
        if (resp.size !== q.need) return false;
        const all = new Set([...q.given.map(([r, c]) => key(r, c)), ...resp]);
        return !!q.check(all);
      }
      case 'dots': return resp.length === q.need && !!q.check(resp);
    }
  } catch (e) { return false; }
  return false;
}
// the example response (used for "show answer" and self-tests)
function exampleResp(q) {
  switch (q.k) {
    case 'in': return q.parts.map((p) => p.ex);
    case 'txt': return q.parts.map((p) => p.ex);
    case 'mc': return q.a;
    case 'multi': return q.a.slice();
    case 'rows': return q.rows.map((r) => r.a.slice());
    case 'order': return q.a.slice();
    case 'match': return q.a.slice();
    case 'grid': return new Set(q.ex.map(([r, c]) => key(r, c)));
    case 'dots': return q.ex.slice();
  }
}

// ---- science words (subj: 'sci'); ids start with "sc" so they never clash with maths words ----
// particle boxes used by the science questions and the word pictures
function particles(kind, cls = 'opt') {
  let c = '';
  const dot = (x, y) => `<circle class="shade" cx="${x}" cy="${y}" r="7"/>`;
  if (kind === 'solid') { for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) c += dot(17 + i * 14, 69 - r * 14); }
  else if (kind === 'liquid') { [[16, 70], [30, 68], [45, 70], [59, 67], [74, 70], [88, 69], [22, 56], [37, 55], [52, 54], [67, 56], [82, 55], [29, 42], [60, 41], [44, 42]].forEach(([x, y]) => (c += dot(x, y))); }
  else { [[18, 20], [62, 14], [86, 40], [40, 46], [20, 68], [70, 66]].forEach(([x, y]) => (c += dot(x, y))); }
  return svg(104, 84, `<rect class="paper" x="2" y="2" width="100" height="80"/>${c}`, cls);
}

const mkRe = (list) => new RegExp('\\b(' + list.map((w) => `(?<${w.id}>${w.re})`).join('|') + ')\\b', 'gi');
// maths questions: maths words only. Science questions: science words + the maths "command" words (tick, describe, explain...)

const WORD_RE_SCI = mkRe([...WORDS.filter((w) => w.subj === 'sci'), ...WORDS.filter((w) => !w.subj && w.cat === 'cmd')]);
function glossify(html, subj = 'math') {
  const RE = subj === 'sci' ? WORD_RE_SCI : WORD_RE;
  const seen = new Set(); let depth = 0;
  return String(html).split(/(<[^>]+>)/).map((seg) => {
    if (seg.startsWith('<')) { if (/^<(svg|table)\b/i.test(seg)) depth++; else if (/^<\/(svg|table)>/i.test(seg)) depth--; return seg; }
    if (depth > 0) return seg;
    return seg.replace(RE, (...args) => {
      const groups = args[args.length - 1]; const id = Object.keys(groups).find((k) => groups[k] !== undefined);
      if (!id || seen.has(id)) return args[0]; seen.add(id);
      return `<span class="gw" role="button" tabindex="0" data-w="${id}">${args[0]}</span>`;
    });
  }).join('');
}

  const pics = pool.filter((x) => x.pic && x.en !== w.en);
  const k = w.pic && pics.length >= 3 && R.int(0, 2) === 0 ? 2 : R.int(0, 1);
  if (k === 0) { const o = R.shuffle([w, ...others(pool)]); return G(mcq({ t, sk, word: w.id, q: `What does <b>${w.en}</b> mean?`, why: w.ex }, o.map((x) => x.vi), o.indexOf(w))); }
  if (k === 1) { const o = R.shuffle([w, ...others(pool)]); return G(mcq({ t, sk, word: w.id, q: `Which word means: <b>${w.vi}</b>?`, why: w.ex }, o.map((x) => x.en), o.indexOf(w))); }
  const same = pics.filter((x) => x.cat === w.cat);
  const o = R.shuffle([w, ...R.shuffle(same.length >= 3 ? same : pics).slice(0, 3)]);
  return G(mcq({ t, sk, word: w.id, fig: w.pic(), q: 'Which word matches the picture?', why: w.vi }, o.map((x) => x.en), o.indexOf(w)));

    case 'multi': return q.exact ? `Chọn đúng ${q.exact} đáp án.` : 'Chọn TẤT CẢ đáp án đúng (có thể nhiều hơn 1).';
    case 'rows': return 'Ở mỗi dòng, bấm chọn một ô.';

  }
  return '';

  s += `<polyline fill="none" class="stroke" points="${pts.map((p) => p.join(',')).join(' ')}"/>` + pts.map(([x, y]) => `<rect class="ink" x="${x - 3}" y="${y - 3}" width="6" height="6"/>`).join('');
  labels.forEach((l, i) => (s += `<text class="lab sm" x="${x0 + 18 + i * gap}" y="${y0 + 17}" text-anchor="middle">${l}</text>`));
  s += `<line class="stroke" x1="${x0}" y1="${top - 6}" x2="${x0}" y2="${y0}"/><line class="stroke" x1="${x0}" y1="${y0}" x2="${W}" y2="${y0}"/>`;
  return svg(W, 192, s);
}

// four bar charts: the right one plus three with a mistake. Returns {opts, a}
function chartChoices(labels, vals, o) {
  const wrong = [];
  const swap = (i, j) => { const v = vals.slice(); [v[i], v[j]] = [v[j], v[i]]; return v; };
  for (let i = 0; i < vals.length; i++) for (let j = i + 1; j < vals.length; j++) if (vals[i] !== vals[j]) wrong.push(swap(i, j));
  const shift = vals.map((v, i) => (i === vals.length - 1 ? Math.max(o.step, v - o.step) : v)); if (shift.join() !== vals.join()) wrong.push(shift);
  const picks = R.shuffle(wrong.filter((w, i, arr) => arr.findIndex((x) => x.join() === w.join()) === i)).slice(0, 3);
  const all = R.shuffle([vals, ...picks]);
  return { opts: all.map((v) => barChart(labels, v, Object.assign({ cls: 'chart', bw: 40 }, o))), a: all.indexOf(vals) };
}

// ---------- progress store (localStorage now, cloud db when available) ----------
const LS = 'candy-math-v1';
const blank = () => ({ v: 1, upd: 0, q: {}, sk: {}, w: {}, look: {}, candies: 0, tests: [], subj: 'math' });
const SUBJ = () => DATA.subj || 'math';
let DATA = blank();
try { const s = localStorage.getItem(LS); if (s) DATA = Object.assign(blank(), JSON.parse(s)); } catch (e) {}
let cloud = null, cloudBusy = false, cloudDirty = false, cloudTimer = null;
function save() {
  DATA.upd = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(DATA)); } catch (e) {}
  if (cloud) { cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1200); }
}
async function pushCloud() {
  if (!cloud || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false;
  try { await cloud.set(JSON.parse(JSON.stringify(DATA))); setSync('Saved'); }
  catch (e) { setSync('Saved on this device'); if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) cloud = null; }
  cloudBusy = false;
  if (cloudDirty) pushCloud();
}
function setSync(t) { const el = $('#sync'); if (el) el.textContent = t; }
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc('progress/' + uid);
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    const remote = snap && snap.exists !== false ? snap.data() : null;
    cloud = ref;
    if (remote && (remote.upd || 0) > (DATA.upd || 0)) {
      DATA = Object.assign(blank(), remote);
      try { localStorage.setItem(LS, JSON.stringify(DATA)); } catch (e) {}
      if (VIEW.name === 'home' || VIEW.name === 'report') render();
      updateCandy();
    } else if ((DATA.upd || 0) > ((remote && remote.upd) || 0)) { cloudDirty = true; pushCloud(); }
    setSync('Synced');
  } catch (e) { cloud = null; }
}

function record(q, ok) {
  const now = Date.now();
  if (!q.gen) { const s = DATA.q[q.id] || { r: 0, w: 0 }; ok ? s.r++ : s.w++; s.last = ok ? 1 : 0; s.t = now; DATA.q[q.id] = s; }
  const k = DATA.sk[q.sk] || { r: 0, w: 0 }; ok ? k.r++ : k.w++; DATA.sk[q.sk] = k;
  if (q.word) { const w = DATA.w[q.word] || { r: 0, w: 0 }; ok ? w.r++ : w.w++; w.last = ok ? 1 : 0; DATA.w[q.word] = w; }
  if (ok) DATA.candies++;
  save();
}
const isMistake = (q) => { const s = DATA.q[q.id]; return s ? s.last === 0 : !!q.paper; };
const mastery = (t) => { if (isWordT(t)) { const ws = wordsOf(subjOf(t)); return ws.filter((w) => DATA.w[w.id] && DATA.w[w.id].last === 1).length / ws.length; } const qs = ORIG.filter((q) => q.t === t); return qs.filter((q) => DATA.q[q.id] && DATA.q[q.id].last === 1).length / qs.length; };
function weakSkills(t) {
  const list = Object.keys(SKILLS).filter((s) => (t ? SKILLS[s].t === t : subjOf(SKILLS[s].t) === SUBJ()) && GEN[s]);
  return list.map((s) => { const k = DATA.sk[s] || { r: 0, w: 0 }; const paperW = ORIG.filter((q) => q.sk === s && isMistake(q)).length; return { s, w: (k.w + 1 + paperW) / (k.r + 1) }; });
}
function pickWeighted(items) { const tot = items.reduce((a, b) => a + b.w, 0); let r = Math.random() * tot; for (const it of items) { r -= it.w; if (r <= 0) return it.s; } return items[items.length - 1].s; }

  const n = Math.round(frac * slots.length);
  let candies = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = slots[i]; const tone = i % 3 === 0 ? 'opacity="0.75"' : '';
    if (i % 4 === 1) candies += `<g transform="translate(${x},${y}) rotate(${(i * 37) % 60 - 30})"><polygon points="-12,-5 -7,0 -12,5" style="fill:${TC[t]}"/><polygon points="12,-5 7,0 12,5" style="fill:${TC[t]}"/><ellipse rx="8" ry="6" style="fill:${TC[t]}" ${tone}/></g>`;
    else candies += `<circle cx="${x}" cy="${y}" r="7.5" style="fill:${TC[t]}" ${tone}/><circle cx="${x - 2.5}" cy="${y - 2.5}" r="2" fill="#fff" opacity="0.7"/>`;
  }

    <rect x="30" y="20" width="60" height="10" rx="4" style="fill:var(--line)"/>
    <path d="M30 30 C14 34 10 44 10 58 L10 118 C10 130 18 136 30 136 L90 136 C102 136 110 130 110 118 L110 58 C110 44 106 34 90 30 Z" style="fill:var(--glass);stroke:var(--line)" stroke-width="3"/>
    <clipPath id="jc${t}"><path d="M30 30 C14 34 10 44 10 58 L10 118 C10 130 18 136 30 136 L90 136 C102 136 110 130 110 118 L110 58 C110 44 106 34 90 30 Z"/></clipPath>
    <g clip-path="url(#jc${t})">${candies}</g>
    <path d="M20 56 C20 48 24 42 30 40" stroke="#fff" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
    <text x="60" y="18" text-anchor="middle" font-family="var(--font-display)" font-size="11" font-weight="700" fill="#3a1f43">${topicOf(t).lid || t}</text>
  </svg>`;
}

// ---------- sessions ----------
function startWorksheet(t) {
  const qs = ORIG.filter((q) => q.t === t);
  const todo = qs.filter((q) => !(DATA.q[q.id] && DATA.q[q.id].last === 1));
  const list = todo.length ? todo.concat(qs.filter((q) => !todo.includes(q))) : qs.slice();
  startQuiz({ title: topicOf(t).name, mode: 'learn', qs: list.slice(0, todo.length || list.length) });
}
function startPractice(t) {
  const w = weakSkills(t); const qs = []; for (let i = 0; i < 10; i++) qs.push(genFor(pickWeighted(w)));
  startQuiz({ title: topicOf(t).name + ': practice', mode: 'learn', qs });
}
function startMistakes() {
  const m = R.shuffle(ORIG.filter((q) => subjOf(q.t) === SUBJ() && isMistake(q))).slice(0, 15);
  const w = weakSkills().sort((a, b) => b.w - a.w).slice(0, 6); const g = []; for (let i = 0; i < (m.length ? 5 : 12); i++) g.push(genFor(pickWeighted(w)));
  startQuiz({ title: 'Fix my mistakes', mode: 'learn', qs: m.concat(g) });
}
function startMock() {
  const qs = []; const tps = TOPICS.filter((tp) => !tp.words && (tp.subj || 'math') === SUBJ()); const per = tps.length >= 5 ? [2, 2] : [4, 3];
  tps.forEach((tp) => {
    R.shuffle(ORIG.filter((q) => q.t === tp.id && q.k !== 'grid' && q.k !== 'dots')).slice(0, per[0]).forEach((q) => qs.push(q));
    const sk = Object.keys(SKILLS).filter((s) => SKILLS[s].t === tp.id && GEN[s]); R.shuffle(sk).slice(0, per[1]).forEach((s) => qs.push(genFor(s)));
  });
  startQuiz({ title: SUBJ_NAME[SUBJ()] + ' mock test', mode: 'test', qs: R.shuffle(qs) });
}
function startWords(subj = 'math') {
  const pool = wordsOf(subj);
  const items = pool.map((w) => { const st = DATA.w[w.id]; const base = w.cat === 'cmd' || w.cat === 'op' ? 2 : 1; const k = !st ? 1.5 : st.last === 0 ? 3 : 0.4; return { s: w.id, w: base * k * (1 + (DATA.look[w.id] || 0) * 0.3) }; });
  const qs = []; const used = new Set();
  while (qs.length < 7) { const id = pickWeighted(items); if (used.has(id)) continue; used.add(id); qs.push(wordQuestion(WORD_BY_ID[id])); }
  for (let i = 0; i < 3; i++) qs.push(clozeQuestion(subj));
  startQuiz({ title: SUBJ_NAME[subj] + ' words', mode: 'learn', qs: R.shuffle(qs) });
}
let TIMER = null;
function startQuiz(s) {
  if (!s.qs.length) return;
  VIEW = { name: 'quiz', s: Object.assign(s, { i: 0, results: [], started: Date.now(), candies: 0 }) };
  newQ(); render(); window.scrollTo(0, 0);
}
function newQ() {
  const s = VIEW.s; const q = s.qs[s.i];
  s.cur = { q, tries: 0, done: false, hint: false, fb: null, resp: emptyResp(q), focus: 0, sel: null };
}
function emptyResp(q) {
  switch (q.k) { case 'in': case 'txt': return q.parts.map(() => ''); case 'mc': return null; case 'multi': return []; case 'rows': return q.rows.map((r) => r.a.map(() => null)); case 'order': return []; case 'match': return q.L.map(() => null); case 'grid': return new Set(); case 'dots': return []; }
}

// ---------- quiz rendering ----------
function renderQuiz() {
  const s = VIEW.s, c = s.cur, q = c.q;
  const top = h('div', { class: 'qtop' });
  top.append(h('h2', {}, s.title));
  const tr = h('div', { class: 'track', 'aria-label': `Question ${s.i + 1} of ${s.qs.length}` });
  s.qs.forEach((_, i) => tr.append(h('i', { class: i < s.results.length ? (s.results[i] ? 'ok' : 'no') : i === s.i ? 'now' : '' })));
  top.append(tr);
  if (s.mode === 'test') { const tm = h('span', { class: 'timer', id: 'tm' }); top.append(tm); }
  const card = h('section', { class: 'card' });
  const chips = h('div', { class: 'chips' });
  chips.append(h('span', { class: 'chip' }, `${s.i + 1} / ${s.qs.length}`));
  chips.append(h('span', { class: 'chip' }, q.gen ? (q.src && q.src !== 'Practice' ? q.src + ' · new numbers' : 'New practice question') : q.src));
  if (!q.gen && s.mode === 'learn' && isMistake(q)) chips.append(h('span', { class: 'chip warn' }, (DATA.q[q.id] ? 'Missed last time' : 'Missed on paper')));
  card.append(chips);
  const gl = (t) => fmtText(isWordT(q.t) ? t : glossify(t, subjOf(q.t)));
  card.append(h('div', { class: 'prompt' }, gl(q.q)));
  if (q.fig) card.append(h('div', { class: 'figwrap' }, fmtText(q.fig)));
  card.append(widget(q, c, gl));
  if (c.read && !c.done) card.append(readBox(q));
  if (c.fb) card.append(c.fb);
  const acts = h('div', { class: 'qacts' });
  if (!c.done) {
    acts.append(h('button', { class: 'btn big', id: 'check', onclick: check }, s.mode === 'test' ? 'Submit' : 'Check'));
    if (s.mode === 'learn' && !isWordT(q.t) && !c.read) acts.append(h('button', { class: 'btn soft', onclick: () => { c.read = true; renderQuiz(); } }, 'Đề hỏi gì?'));
    if (s.mode === 'learn' && !c.hint) acts.append(h('button', { class: 'btn soft', onclick: () => { c.hint = true; c.fb = hintBox(q); renderQuiz(); } }, 'Gợi ý'));
  } else acts.append(h('button', { class: 'btn big', id: 'next', onclick: next }, s.i + 1 < s.qs.length ? 'Next' : 'Finish'));
  if (s.mode === 'learn' && !c.done) acts.append(h('button', { class: 'link', onclick: () => giveUp() }, 'Show answer'));
  card.append(acts);
  const back = h('div', { class: 'foot' }); back.append(h('button', { class: 'link', onclick: () => go({ name: 'home' }) }, s.mode === 'test' ? 'Stop the test' : 'Back to jars'));
  shell([top, card, back]);
  if (s.mode === 'test') { const tick = () => { const el = $('#tm'); if (!el) return; const sec = Math.floor((Date.now() - s.started) / 1000); el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }; tick(); clearInterval(TIMER); TIMER = setInterval(tick, 1000); }
  const fi = $('.ans.on'); if (fi && !coarse) fi.focus({ preventScroll: true });
}
function readBox(q) {
  const v = q.vi || VI[q.id]; const rows = [];
  if (v && v[0]) rows.push(['Cho biết', v[0]]);
  if (v && v[1]) rows.push(['Hỏi', v[1]]);
  rows.push(['Cách trả lời', (v && v[2]) || howTo(q)]);
  if (!v) rows.push(['Mẹo', 'Chạm vào chữ gạch chân để xem nghĩa tiếng Việt.']);
  return h('div', { class: 'feedback read' }, rows.map(([k, t]) => `<div><b>${k}:</b> ${fmtText(t.replace(/(\d+)\/(\d+)/g, '[[$1/$2]]'))}</div>`).join(''));

function widget(q, c, gl = fmtText) {
  const lock = c.done;
  const mark = c.markResult; // undefined | true | false after check
  const cls = (base) => base + (lock && mark !== undefined ? (mark ? ' ok' : ' no') : '');
  switch (q.k) {
    case 'in': {
      const box = h('div', { class: 'parts' });
      q.parts.forEach((p, i) => {
        const row = h('div', { class: 'part' });
        if (p.pre) row.append(h('span', {}, gl(p.pre)));
        const inp = h('input', { class: cls('ans' + (i === c.focus && !lock ? ' on' : '')), value: c.resp[i], 'aria-label': `Answer ${i + 1}`, autocomplete: 'off', inputmode: coarse ? 'none' : 'text', readonly: lock || false, size: Math.max(4, String(c.resp[i]).length + 1) });
        inp.addEventListener('input', () => { c.resp[i] = inp.value; inp.size = Math.max(4, inp.value.length + 1); });
        inp.addEventListener('focus', () => { c.focus = i; document.querySelectorAll('.ans').forEach((e, j) => e.classList.toggle('on', j === i && !lock)); });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (i + 1 < q.parts.length) document.querySelectorAll('.ans')[i + 1].focus(); else check(); } });
        row.append(inp);
        if (p.post) row.append(h('span', {}, gl(p.post)));
        box.append(row);
      });
      if (!lock) box.append(keypad(q, c));
      return box;
    }
    case 'txt': {
      const box = h('div', { class: 'parts' });
      q.parts.forEach((p, i) => {
        const row = h('div', { class: 'part' });
        if (p.pre) row.append(h('span', {}, gl(p.pre)));
        const inp = h('input', { class: cls('ans txt' + (i === c.focus && !lock ? ' on' : '')), value: c.resp[i], 'aria-label': `Answer ${i + 1}`, autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', inputmode: 'text', readonly: lock || false, size: Math.max(12, String(c.resp[i]).length + 2) });
        inp.addEventListener('input', () => { c.resp[i] = inp.value; });
        inp.addEventListener('focus', () => { c.focus = i; });

function respFor(q, c) { return q.k === 'in' || q.k === 'txt' ? c.resp.map((x) => String(x || '')) : c.resp; }

  H.cards.forEach((c) => grid.append(h('div', { class: 'rt hcard' }, `<h3>${c.h}</h3><div class="figwrap">${hpic[c.pic]()}</div><ol>${c.steps.map((x) => `<li>${x}</li>`).join('')}</ol><p class="hex"><b>Ví dụ:</b> ${c.ex}</p><p class="htrap"><b>Bẫy:</b> ${c.trap}</p>`)));
  box.append(grid);
  const qa2 = h('div', { class: 'qacts' }); qa2.append(h('button', { class: 'btn big', onclick: () => startHowto(subj) }, 'Luyện nhanh (8 câu)')); box.append(qa2);
  const back = h('div', { class: 'foot' }); back.append(h('button', { class: 'link', onclick: () => go({ name: 'home' }) }, 'Back to jars')); box.append(back);
  shell(box);
}
function startHowto(subj) { startQuiz({ title: 'Cách làm bài · ' + SUBJ_NAME[subj], mode: 'learn', qs: R.shuffle(HOWTO[subj].quiz).slice(0, 8).map((it) => howtoQuestion(subj, it)) }); }

// ---------- science exam notes ----------
function renderNotes() {
  const t = VIEW.t; const tp = topicOf(t); const n = SCI_NOTES[t];
  const box = h('section', { class: 'report' });
  box.append(h('div', { class: 'hello' }, `<h1>${tp.sheet}: ${tp.name}</h1><p>${n.src}. Chạm vào chữ gạch chân để xem nghĩa.</p>`));
  n.cards.forEach((c) => box.append(h('div', { class: 'rt note' }, `<h3>${c.h}</h3>${c.p.map((x) => `<p>${glossify(x, 'sci')}</p>`).join('')}<p class="note-vi" lang="vi">${c.vi}</p>`)));
  const qa = h('div', { class: 'qacts' });
  qa.append(h('button', { class: 'btn big', onclick: () => startWorksheet(t) }, 'Worksheet'), h('button', { class: 'btn big soft', onclick: () => startPractice(t) }, 'Practice'));
  box.append(qa);
  const back = h('div', { class: 'foot' }); back.append(h('button', { class: 'link', onclick: () => go({ name: 'home' }) }, 'Back to jars')); box.append(back);
  shell(box);
}

render();
